name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
      - name: Tune Gradle
        run: |
          chmod +x ./gradlew
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "OFFLINE=true" >> ./app.properties
      - name: Generate signing key
        run: keytool -genkeypair -keystore app/release_key.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=refra"
      - name: Build arm64 release APK
        run: ./gradlew --build-cache :app:assembleArm64-v8aNoMLRelease
        env:
          SIGNING_KEY_ALIAS: key
          SIGNING_KEY_PASSWORD: "123456"
          SIGNING_STORE_PASSWORD: "123456"
      - uses: actions/upload-artifact@v5
        with:
          name: refra-arm64
          path: app/build/outputs/apk-renamed/**/*.apk
